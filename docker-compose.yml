name: dashboard
services:
  dashboard:
    build: .
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3003}:80"
    restart: unless-stopped
    depends_on:
      - collector
    networks:
      - bitcoin
  collector:
    build: ./backend
    environment:
      POLL_SECONDS: "${POLL_SECONDS:-60}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${BITCOIN_CONFIG_PATH:?Set BITCOIN_CONFIG_PATH in .env}:/run/bitcoin.conf:ro
      - ${JOINMARKET_ENV_PATH:?Set JOINMARKET_ENV_PATH in .env}:/run/jam.env:ro
      - ${LND_TLS_CERT_PATH:?Set LND_TLS_CERT_PATH in .env}:/run/lnd/tls.cert:ro
      - ${LND_DASHBOARD_MACAROON_PATH:?Set LND_DASHBOARD_MACAROON_PATH in .env}:/run/lnd/dashboard.macaroon:ro
      - ${ELECTRS_DATA_PATH:?Set ELECTRS_DATA_PATH in .env}:/electrs-db:ro
      - ${DASHBOARD_STATE_PATH:-./state}:/state
    networks:
      - bitcoin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  bitcoin:
    external: true
    name: ${BITCOIN_DOCKER_NETWORK:-bitcoin}
